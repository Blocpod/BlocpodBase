name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:dependencies
      - run: pnpm ci:application

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Install pinned Solidity dependencies
        run: ./scripts/install-dependencies.sh
        working-directory: contracts
      - name: Run contract acceptance
        run: ./scripts/contract-acceptance.sh
        working-directory: contracts

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blocpod
          POSTGRES_PASSWORD: blocpod
          POSTGRES_DB: blocpod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blocpod -d blocpod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blocpod:blocpod@127.0.0.1:5432/blocpod_test
      TEST_DATABASE_URL: postgresql://blocpod:blocpod@127.0.0.1:5432/blocpod_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blocpod/backend migrate
      - run: pnpm --filter @blocpod/indexer test:integration

  agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blocpod/agent typecheck
      - run: pnpm --filter @blocpod/agent test:runtime
